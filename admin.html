<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5ff">
  <title>새잎 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #eef7ff, transparent 35%),
        linear-gradient(135deg, #f9fcff, #edf5ff);
      color: #40536f;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,.94);
      border: 1px solid #dce9f8;
      border-radius: 26px;
      padding: 38px 32px;
      box-shadow: 0 20px 60px rgba(83, 125, 180, .14);
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #e8f2ff;
      color: #76a6ec;
      font-size: 30px;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 25px;
      color: #344a69;
    }

    .login-card > p {
      margin: 0 0 27px;
      color: #8a9bb2;
      font-size: 14px;
    }

    .password-input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 1px solid #d9e5f3;
      border-radius: 13px;
      outline: none;
      background: #fbfdff;
      color: #40536f;
      transition: .2s;
    }

    .password-input:focus {
      border-color: #91b7ee;
      box-shadow: 0 0 0 4px rgba(120, 167, 234, .12);
    }

    .login-button {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      background: #78a8ec;
      color: white;
      font-weight: 800;
    }

    .login-button:hover {
      background: #699be2;
    }

    .login-message {
      min-height: 20px;
      margin: 13px 0 0 !important;
      font-size: 13px !important;
      color: #e2778e !important;
    }

    .admin-page {
      width: min(1500px, calc(100% - 50px));
      margin: 0 auto;
      padding: 35px 0 70px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .admin-header small {
      color: #86a0c0;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .admin-header h1 {
      margin: 5px 0 0;
      color: #344a69;
      font-size: 28px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .small-button {
      border: 1px solid #d7e5f6;
      background: white;
      color: #6884aa;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: rgba(255,255,255,.95);
      border: 1px solid #dce8f6;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 14px 40px rgba(81, 121, 171, .09);
    }

    .panel h2 {
      margin: 0 0 18px;
      color: #405875;
      font-size: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #7188a6;
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #dbe6f3;
      background: #fbfdff;
      border-radius: 11px;
      padding: 11px 12px;
      outline: none;
      color: #40536f;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #91b7ee;
    }

    .save-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #78a8ec;
      color: white;
      font-weight: 800;
    }

    .cancel-edit {
      width: 100%;
      margin-top: 8px;
      border: 1px solid #dbe6f3;
      border-radius: 12px;
      padding: 11px;
      background: white;
      color: #7c8fa8;
      font-weight: 700;
    }

    .status {
      min-height: 18px;
      margin-top: 12px;
      font-size: 12px;
      color: #7190ba;
    }

    .schedule-list {
      display: grid;
      gap: 10px;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid #e0e9f4;
      border-radius: 14px;
      background: #fbfdff;
    }

    .schedule-date {
      text-align: center;
      color: #6d91c4;
      font-size: 12px;
      font-weight: 800;
    }

    .schedule-info h3 {
      margin: 0 0 4px;
      color: #465f80;
      font-size: 14px;
    }

    .schedule-info p {
      margin: 0;
      color: #8999ad;
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: 20px;
      background: #e8f2ff;
      color: #719bd4;
      font-size: 10px;
      font-weight: 800;
    }

    .badge.special {
      background: #f0eaff;
      color: #9a80c9;
    }

    .item-buttons {
      display: flex;
      gap: 5px;
    }

    .edit-button,
    .delete-button {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .edit-button {
      background: #eaf3ff;
      color: #6c96d1;
    }

    .delete-button {
      background: #fff0f3;
      color: #d8798e;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: #9aaabd;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .schedule-item {
        grid-template-columns: 65px 1fr;
      }

      .item-buttons {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }
    }
  /* =========================
   관리자 일정 달력
========================= */

.admin-calendar-panel {
  width: 100%;
  min-height: calc(100vh - 170px);
  margin-bottom: 20px;
  display: flex;
  flex-direction: column;
}

.admin-calendar-days {
  flex: 1;
  grid-template-rows: repeat(6, 1fr);
}

.admin-calendar-day {
  min-height: 100px;
}

.admin-calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 18px;
}

.admin-calendar-title {
  text-align: center;
}

.admin-calendar-title small {
  display: block;
  margin-bottom: 2px;
  color: #8aa7cb;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 1px;
}

.admin-calendar-title strong {
  color: #405875;
  font-size: 21px;
}

.admin-calendar-nav {
  width: 38px;
  height: 38px;
  border: 1px solid #dce8f6;
  border-radius: 11px;
  background: #f8fbff;
  color: #78a8ec;
  font-size: 20px;
  font-weight: 800;
}

.admin-calendar-weekdays,
.admin-calendar-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}

.admin-calendar-weekdays {
  margin-bottom: 6px;
}

.admin-calendar-weekdays span {
  padding: 7px 0;
  text-align: center;
  color: #8a9bb2;
  font-size: 11px;
  font-weight: 800;
}

.admin-calendar-weekdays span:first-child {
  color: #e47d92;
}

.admin-calendar-weekdays span:last-child {
  color: #719bd4;
}

.admin-calendar-day {
  position: relative;
  min-height: 100px;
  padding: 9px;
  border: 1px solid #edf2f8;
  border-radius: 11px;
  background: #fbfdff;
  color: #526985;
  text-align: left;
  vertical-align: top;
align-content: start;
  font-size: 12px;
  font-weight: 700;
  transition: .15s;
}

    .admin-calendar-day > span:first-child {
  position: absolute;
  top: 9px;
  left: 9px;
}

.admin-calendar-day:not(.empty):hover {
  border-color: #9fc1ef;
  background: #f2f7ff;
}

.admin-calendar-day.empty {
  border-color: transparent;
  background: transparent;
  cursor: default;
}

.admin-calendar-day.has-event {
  border-color: #d6e5f7;
}

.admin-calendar-dot {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
}

/* 방송 */
.admin-calendar-dot.live {
  background: #70a1f3;
}

/* 합방 */
.admin-calendar-dot.collab {
  background: #55c7b7;
}

/* 휴방 */
.admin-calendar-dot.off {
  background: #ef7f8f;
}

/* 기념일 */
.admin-calendar-dot.anniversary {
  background: #a78bfa;
}

/* 날짜 클릭 후 뜨는 일정 선택창 */
.schedule-modal {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(42, 61, 87, .35);
  backdrop-filter: blur(3px);
}

.schedule-modal.hidden {
  display: none;
}

.schedule-modal-card {
  width: min(500px, 100%);
  max-height: 80vh;
  overflow-y: auto;
  padding: 22px;
  border: 1px solid #dce8f6;
  border-radius: 20px;
  background: white;
  box-shadow: 0 20px 60px rgba(58, 86, 124, .22);
}

.schedule-modal-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  margin-bottom: 16px;
}

.schedule-modal-head h2 {
  margin: 0;
  color: #405875;
  font-size: 18px;
}

.schedule-modal-close {
  width: 34px;
  height: 34px;
  border: 0;
  border-radius: 10px;
  background: #eef5ff;
  color: #719bd4;
  font-weight: 800;
}

.schedule-modal-list {
  display: grid;
  gap: 14px;
}

.schedule-modal-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 13px;
  border: 1px solid #e1eaf5;
  border-radius: 12px;
  background: #fbfdff;
}

.schedule-modal-item-info {
  min-width: 0;
}

.schedule-modal-item-info strong {
  display: block;
  margin-bottom: 3px;
  color: #465f80;
  font-size: 14px;
}

.schedule-modal-item-info small {
  color: #8999ad;
}

.schedule-modal-edit {
  flex-shrink: 0;
  border: 0;
  border-radius: 9px;
  padding: 8px 11px;
  background: #eaf3ff;
  color: #6c96d1;
  font-size: 11px;
  font-weight: 800;
}

@media (max-width: 800px) {
  .admin-calendar-day {
    min-height: 52px;
    padding: 6px;
  }

  .admin-calendar-dot {
    top: 6px;
    right: 6px;
  }
}

.time-select-row {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
}

.time-select-row select {
  width: 100%;
  border: 1px solid #dbe6f3;
  background: #fbfdff;
  border-radius: 11px;
  padding: 11px 12px;
  outline: none;
  color: #40536f;
}

.time-select-row select:focus {
  border-color: #91b7ee;
}
    .admin-calendar-event-content {
  margin-top: 26px;
  display: grid;
  gap: 6px;
}

.admin-calendar-event {
  min-width: 0;
}

.admin-calendar-event strong {
  display: block;
  overflow: hidden;
  color: #405875;
  font-size: 13px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.admin-calendar-event small {
  display: block;
  margin-top: 2px;
  overflow: hidden;
  color: #8194ad;
  font-size: 11px;
  line-height: 1.35;
  text-overflow: ellipsis;
  white-space: nowrap;
}
      #calendarEventList {
  display: grid;
  gap: 7px;
}
  </style>
</head>

  <script>
    const SUPABASE_URL =
      "https://txwlwxldagplfhlgopyl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_L0rNucD4rLdHlte3wwWipg_sdl5j5WE";

    const ADMIN_EMAIL =
      "jkui1109@gmail.com";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const loginPage =
      document.querySelector("#loginPage");

    const adminPage =
      document.querySelector("#adminPage");

    const loginForm =
      document.querySelector("#loginForm");

    const loginMessage =
      document.querySelector("#loginMessage");

    let schedules = [];
let scheduleReplays = [];
let songs = [];

// ↓ 여기부터 추가
async function loadSongs() {
  try {
    const response = await fetch(
      `${SUPABASE_URL}/rest/v1/songs?select=*&order=title.asc`,
      {
        headers: {
          apikey: SUPABASE_KEY,
          Authorization: `Bearer ${SUPABASE_KEY}`
        }
      }
    );

    if (!response.ok) {
      throw new Error("노래 목록을 불러오지 못했습니다.");
    }

    songs = await response.json();

    console.log("불러온 노래:", songs);

    renderSongs();
  } catch (error) {
    console.error("노래 불러오기 오류:", error);
  }
}

    function renderSongs() {
  const list =
    document.querySelector("#songAdminList");

  if (!list) return;

  if (!songs.length) {
    list.innerHTML = `
      <div class="empty">
        등록된 노래가 없어요.
      </div>
    `;
    return;
  }

  list.innerHTML = songs.map(song => {
    const category =
      song.category === "jpop"
        ? "JPOP"
        : "KPOP";

    const genreNames = {
      ballad: "발라드",
      dance: "댄스",
      band: "밴드"
    };

    const genre =
      genreNames[song.genre] || song.genre || "";

    return `
      <div class="schedule-item">
        <div class="schedule-info">
          <h3>${escapeHTML(song.title || "")}</h3>

          <p>
            ${escapeHTML(song.artist || "")}
            · ${category}
            · ${escapeHTML(genre)}
          </p>
        </div>
        <div class="item-buttons">
  <button
    type="button"
    class="small-button"
    onclick="editSong(${song.id})"
  >
    수정
  </button>

  <button
    type="button"
    class="delete-button"
    onclick="deleteSong(${song.id})"
  >
    삭제
  </button>
</div>
      </div>
    `;
  }).join("");
}

let editingSongId = null;

window.editSong = function(id) {
  const song =
    songs.find(item => item.id === id);

  if (!song) {
    alert("노래 정보를 찾지 못했어요.");
    return;
  }

  editingSongId = id;

  document.querySelector("#songTitle").value =
    song.title || "";

  document.querySelector("#songArtist").value =
    song.artist || "";

  document.querySelector("#songCategory").value =
    song.category || "kpop";

  document.querySelector("#songGenre").value =
    song.genre || "ballad";

  document.querySelector("#songSaveButton").textContent =
    "노래 수정";

  document.querySelector("#songStatus").textContent =
    "수정할 내용을 입력해 주세요.";
};
    
    window.deleteSong =
  async function(id) {

    const song =

function getScheduleTypeName(type) {
  if (type === "planned") return "방송 예정";
  if (type === "dawn") return "새벽 방송";
  if (type === "morning") return "아침 방송";
  if (type === "afternoon") return "낮 방송";
  if (type === "evening") return "저녁 방송";
  if (type === "collab") return "합방";
  if (type === "off") return "휴방";
  if (type === "etc") return "기념일";

  return "방송";
}

      time: (() => {
  const period =
    document.querySelector("#modalPeriod").value;

  let hour =
    Number(
      document.querySelector("#modalHour").value
    );

  const minute =
    document.querySelector("#modalMinute").value;

  if (period === "AM" && hour === 12) {
    hour = 0;
  }

  if (period === "PM" && hour !== 12) {
    hour += 12;
  }

  return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
})(),

      title,

      type:
        document.querySelector(
          "#modalType"
        ).value,

      description:
        document.querySelector(
          "#modalDescription"
        ).value.trim()
    };

    status.textContent =
      id ? "수정 중..." : "등록 중...";

    let result;

    if (id) {
      result =
        await supabaseClient
          .from("stream_schedule")
          .update(scheduleData)
          .eq("id", id);

    } else {
      result =
        await supabaseClient
          .from("stream_schedule")
          .insert(scheduleData);
    }

    if (result.error) {
      console.error(result.error);

      status.textContent =
        "저장하지 못했어요.";

      return;
    }

    await loadSchedules();

    const selectedDate =
      scheduleData.date;

    const dayEvents =
      schedules.filter(
        event => event.date === selectedDate
      );

    openScheduleModal(
      selectedDate,
      dayEvents
    );
  };


window.deleteCalendarSchedule =
  async function(id) {

    const item =
      schedules.find(
        schedule => schedule.id === id
      );

    if (!item) return;

    if (!confirm("이 일정을 삭제할까요?")) {
      return;
    }

    const dateKey = item.date;

    const { error } =
      await supabaseClient
        .from("stream_schedule")
        .delete()
        .eq("id", id);

    if (error) {
      console.error(error);
      alert("일정을 삭제하지 못했어요.");
      return;
    }

    await loadSchedules();

    const dayEvents =
      schedules.filter(
        event => event.date === dateKey
      );

    openScheduleModal(
      dateKey,
      dayEvents
    );
  };


window.backToCalendarScheduleList =
  function(dateKey) {

    const dayEvents =
      schedules.filter(
        event => event.date === dateKey
      );

    openScheduleModal(
      dateKey,
      dayEvents
    );
  };

function closeScheduleModal() {
  document
    .querySelector("#scheduleModal")
    .classList.add("hidden");
}



document
  .querySelector("#scheduleModalClose")
  .addEventListener(
    "click",
    closeScheduleModal
  );


document
  .querySelector("#scheduleModal")
  .addEventListener(
    "click",
    event => {

      if (
        event.target.id === "scheduleModal"
      ) {
        closeScheduleModal();
      }
    }
  );


document
  .querySelector("#adminPrevMonth")
  .addEventListener(
    "click",
    () => {

      adminCalendarMonth--;

      if (adminCalendarMonth < 0) {
        adminCalendarMonth = 11;
        adminCalendarYear--;
      }

      renderAdminCalendar();
    }
  );


document
  .querySelector("#adminNextMonth")
  .addEventListener(
    "click",
    () => {

      adminCalendarMonth++;

      if (adminCalendarMonth > 11) {
        adminCalendarMonth = 0;
        adminCalendarYear++;
      }

      renderAdminCalendar();
    }
  );



    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
document
  .querySelector("#scheduleManageButton")
  .addEventListener("click", () => {
    document
      .querySelector("#scheduleManagePage")
      .classList.remove("hidden");

    document
      .querySelector("#songManagePage")
      .classList.add("hidden");
  });

document
  .querySelector("#songManageButton")
  .addEventListener("click", () => {
    document
      .querySelector("#scheduleManagePage")
      .classList.add("hidden");

    document
      .querySelector("#songManagePage")
      .classList.remove("hidden");
  });

    document
  .querySelector("#songSaveButton")
  .addEventListener("click", async () => {
    const title =
      document.querySelector("#songTitle").value.trim();

    const artist =
      document.querySelector("#songArtist").value.trim();

    const category =
      document.querySelector("#songCategory").value;

    const genre =
      document.querySelector("#songGenre").value;

    const status =
      document.querySelector("#songStatus");

    if (!title || !artist) {
      status.textContent =
        "곡명과 가수를 입력해 주세요.";
      return;
    }

    status.textContent = "등록 중...";

    const { error } =
      await supabaseClient
        .from("songs")
        .insert({
          title,
          artist,
          category,
          genre
        });

    if (error) {
      console.error(error);

      status.textContent =
        "노래를 등록하지 못했어요.";

      return;
    }

    document.querySelector("#songTitle").value = "";
    document.querySelector("#songArtist").value = "";

    status.textContent =
      "노래를 등록했어요. 🩵";

    await loadSongs();
  });
    
    checkSession();
  </script>
