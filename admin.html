<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf5ff">
  <title>새잎 관리자</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, #eef7ff, transparent 35%),
        linear-gradient(135deg, #f9fcff, #edf5ff);
      color: #40536f;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .login-card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,.94);
      border: 1px solid #dce9f8;
      border-radius: 26px;
      padding: 38px 32px;
      box-shadow: 0 20px 60px rgba(83, 125, 180, .14);
      text-align: center;
    }

    .logo {
      width: 60px;
      height: 60px;
      margin: 0 auto 18px;
      border-radius: 20px;
      display: grid;
      place-items: center;
      background: #e8f2ff;
      color: #76a6ec;
      font-size: 30px;
    }

    .login-card h1 {
      margin: 0 0 8px;
      font-size: 25px;
      color: #344a69;
    }

    .login-card > p {
      margin: 0 0 27px;
      color: #8a9bb2;
      font-size: 14px;
    }

    .password-input {
      width: 100%;
      height: 50px;
      padding: 0 16px;
      border: 1px solid #d9e5f3;
      border-radius: 13px;
      outline: none;
      background: #fbfdff;
      color: #40536f;
      transition: .2s;
    }

    .password-input:focus {
      border-color: #91b7ee;
      box-shadow: 0 0 0 4px rgba(120, 167, 234, .12);
    }

    .login-button {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      background: #78a8ec;
      color: white;
      font-weight: 800;
    }

    .login-button:hover {
      background: #699be2;
    }

    .login-message {
      min-height: 20px;
      margin: 13px 0 0 !important;
      font-size: 13px !important;
      color: #e2778e !important;
    }

    .admin-page {
      width: min(1100px, calc(100% - 32px));
      margin: 0 auto;
      padding: 35px 0 70px;
    }

    .admin-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 25px;
    }

    .admin-header small {
      color: #86a0c0;
      font-weight: 800;
      letter-spacing: 1.5px;
    }

    .admin-header h1 {
      margin: 5px 0 0;
      color: #344a69;
      font-size: 28px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .small-button {
      border: 1px solid #d7e5f6;
      background: white;
      color: #6884aa;
      border-radius: 11px;
      padding: 10px 14px;
      font-weight: 700;
    }

    .layout {
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 20px;
      align-items: start;
    }

    .panel {
      background: rgba(255,255,255,.95);
      border: 1px solid #dce8f6;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 14px 40px rgba(81, 121, 171, .09);
    }

    .panel h2 {
      margin: 0 0 18px;
      color: #405875;
      font-size: 18px;
    }

    .field {
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      margin-bottom: 6px;
      color: #7188a6;
      font-size: 12px;
      font-weight: 800;
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      border: 1px solid #dbe6f3;
      background: #fbfdff;
      border-radius: 11px;
      padding: 11px 12px;
      outline: none;
      color: #40536f;
    }

    .field textarea {
      min-height: 90px;
      resize: vertical;
    }

    .field input:focus,
    .field select:focus,
    .field textarea:focus {
      border-color: #91b7ee;
    }

    .save-button {
      width: 100%;
      border: 0;
      border-radius: 12px;
      padding: 13px;
      background: #78a8ec;
      color: white;
      font-weight: 800;
    }

    .cancel-edit {
      width: 100%;
      margin-top: 8px;
      border: 1px solid #dbe6f3;
      border-radius: 12px;
      padding: 11px;
      background: white;
      color: #7c8fa8;
      font-weight: 700;
    }

    .status {
      min-height: 18px;
      margin-top: 12px;
      font-size: 12px;
      color: #7190ba;
    }

    .schedule-list {
      display: grid;
      gap: 10px;
    }

    .schedule-item {
      display: grid;
      grid-template-columns: 80px 1fr auto;
      gap: 14px;
      align-items: center;
      padding: 14px;
      border: 1px solid #e0e9f4;
      border-radius: 14px;
      background: #fbfdff;
    }

    .schedule-date {
      text-align: center;
      color: #6d91c4;
      font-size: 12px;
      font-weight: 800;
    }

    .schedule-info h3 {
      margin: 0 0 4px;
      color: #465f80;
      font-size: 14px;
    }

    .schedule-info p {
      margin: 0;
      color: #8999ad;
      font-size: 12px;
      line-height: 1.5;
    }

    .badge {
      display: inline-block;
      margin-top: 6px;
      padding: 3px 7px;
      border-radius: 20px;
      background: #e8f2ff;
      color: #719bd4;
      font-size: 10px;
      font-weight: 800;
    }

    .badge.special {
      background: #f0eaff;
      color: #9a80c9;
    }

    .item-buttons {
      display: flex;
      gap: 5px;
    }

    .edit-button,
    .delete-button {
      border: 0;
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 11px;
      font-weight: 800;
    }

    .edit-button {
      background: #eaf3ff;
      color: #6c96d1;
    }

    .delete-button {
      background: #fff0f3;
      color: #d8798e;
    }

    .empty {
      padding: 45px 20px;
      text-align: center;
      color: #9aaabd;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .layout {
        grid-template-columns: 1fr;
      }

      .admin-header {
        align-items: flex-start;
        flex-direction: column;
      }

      .schedule-item {
        grid-template-columns: 65px 1fr;
      }

      .item-buttons {
        grid-column: 1 / -1;
        justify-content: flex-end;
      }
    }
  </style>
</head>

<body>

  <section class="login-page" id="loginPage">
    <div class="login-card">
      <div class="logo">✿</div>

      <h1>새잎 관리자 🩵</h1>
      <p>관리자 비밀번호를 입력해 주세요.</p>

      <form id="loginForm">
        <input
          class="password-input"
          id="password"
          type="password"
          placeholder="비밀번호"
          autocomplete="current-password"
          required
        >

        <button class="login-button" type="submit">
          관리자 로그인
        </button>
      </form>

      <p class="login-message" id="loginMessage"></p>
    </div>
  </section>

  <main class="admin-page hidden" id="adminPage">

    <header class="admin-header">
      <div>
        <small>SAEIP ADMIN</small>
        <h1>방송 일정 관리 🩵</h1>
      </div>

      <div class="header-actions">
        <button class="small-button" id="homeButton" type="button">
          사이트 보기
        </button>

        <button class="small-button" id="logoutButton" type="button">
          로그아웃
        </button>
      </div>
    </header>

    <div class="layout">

      <section class="panel">
        <h2 id="formTitle">새 일정 추가</h2>

        <form id="scheduleForm">

          <div class="field">
            <label for="date">날짜</label>
            <input id="date" type="date" required>
          </div>

          <div class="field">
            <label for="time">시간</label>
            <input id="time" type="time" value="12:00">
          </div>

          <div class="field">
            <label for="title">일정 제목</label>
            <input
              id="title"
              type="text"
              placeholder="예: 소통방송"
              maxlength="100"
              required
            >
          </div>

          <div class="field">
            <label for="type">일정 종류</label>

            <select id="type">
  <option value="morning">아침 방송</option>
  <option value="afternoon">낮 방송</option>
  <option value="evening">저녁 방송</option>
  <option value="collab">합방</option>
  <option value="off">휴방</option>
  <option value="etc">기타</option>
</select>
          </div>

          <div class="field">
            <label for="description">설명</label>

            <textarea
              id="description"
              placeholder="일정에 대한 설명을 입력해 주세요."
              maxlength="500"
            ></textarea>
          </div>

          <button class="save-button" type="submit" id="saveButton">
            일정 등록
          </button>

          <button
            class="cancel-edit hidden"
            id="cancelEdit"
            type="button"
          >
            수정 취소
          </button>

          <div class="status" id="status"></div>
        </form>
      </section>

      <section class="panel">
        <h2>등록된 방송 일정</h2>

        <div class="schedule-list" id="scheduleList">
          <div class="empty">일정을 불러오는 중...</div>
        </div>
      </section>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL =
      "https://txwlwxldagplfhlgopyl.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_L0rNucD4rLdHlte3wwWipg_sdl5j5WE";

    const ADMIN_EMAIL =
      "jkui1109@gmail.com";

    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );

    const loginPage =
      document.querySelector("#loginPage");

    const adminPage =
      document.querySelector("#adminPage");

    const loginForm =
      document.querySelector("#loginForm");

    const loginMessage =
      document.querySelector("#loginMessage");

    const scheduleForm =
      document.querySelector("#scheduleForm");

    const scheduleList =
      document.querySelector("#scheduleList");

    const statusBox =
      document.querySelector("#status");

    const cancelEdit =
      document.querySelector("#cancelEdit");

    const formTitle =
      document.querySelector("#formTitle");

    const saveButton =
      document.querySelector("#saveButton");

    let editingId = null;
    let schedules = [];

    function showLogin() {
      loginPage.classList.remove("hidden");
      adminPage.classList.add("hidden");
    }

    function showAdmin() {
      loginPage.classList.add("hidden");
      adminPage.classList.remove("hidden");

      loadSchedules();
    }

    async function checkSession() {
      const {
        data: { session }
      } = await supabaseClient.auth.getSession();

      if (
        session &&
        session.user &&
        session.user.email === ADMIN_EMAIL
      ) {
        showAdmin();
      } else {
        if (session) {
          await supabaseClient.auth.signOut();
        }

        showLogin();
      }
    }

    loginForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        loginMessage.textContent =
          "로그인 중...";

        const password =
          document.querySelector("#password").value;

        const {
          data,
          error
        } =
          await supabaseClient.auth.signInWithPassword({
            email: ADMIN_EMAIL,
            password
          });

        if (error) {
          loginMessage.textContent =
            "비밀번호가 올바르지 않아요.";

          return;
        }

        if (
          !data.user ||
          data.user.email !== ADMIN_EMAIL
        ) {
          await supabaseClient.auth.signOut();

          loginMessage.textContent =
            "관리자 계정이 아닙니다.";

          return;
        }

        document.querySelector("#password").value = "";
        loginMessage.textContent = "";

        showAdmin();
      }
    );

    document
      .querySelector("#logoutButton")
      .addEventListener(
        "click",
        async () => {
          await supabaseClient.auth.signOut();
          showLogin();
        }
      );

    document
      .querySelector("#homeButton")
      .addEventListener(
        "click",
        () => {
          window.location.href = "/";
        }
      );

    async function loadSchedules() {
      scheduleList.innerHTML =
        '<div class="empty">일정을 불러오는 중...</div>';

      const {
        data,
        error
      } =
        await supabaseClient
          .from("stream_schedule")
          .select("*")
          .order("date", {
            ascending: true
          })
          .order("time", {
            ascending: true
          });

      if (error) {
        console.error(error);

        scheduleList.innerHTML =
          '<div class="empty">일정을 불러오지 못했어요.</div>';

        return;
      }

      schedules = data || [];

      renderSchedules();
    }

    function renderSchedules() {
      if (!schedules.length) {
        scheduleList.innerHTML =
          '<div class="empty">아직 등록된 일정이 없어요. 🩵</div>';

        return;
      }

      scheduleList.innerHTML =
        schedules.map(item => {

          const safeTitle =
            escapeHTML(item.title || "");

          const safeDescription =
            escapeHTML(item.description || "");

          const safeDate =
            escapeHTML(item.date || "");

          const safeTime =
            item.time
              ? escapeHTML(
                  String(item.time).slice(0, 5)
                )
              : "";

          const special =
            item.type === "special";

          return `
            <article class="schedule-item">

              <div class="schedule-date">
                ${safeDate}
                ${
                  safeTime
                    ? `<br>${safeTime}`
                    : ""
                }
              </div>

              <div class="schedule-info">
                <h3>${safeTitle}</h3>

                ${
                  safeDescription
                    ? `<p>${safeDescription}</p>`
                    : ""
                }

                <span class="badge ${special ? "special" : ""}">
                  ${special ? "특별 일정" : "방송"}
                </span>
              </div>

              <div class="item-buttons">

                <button
                  class="edit-button"
                  type="button"
                  onclick="editSchedule(${item.id})"
                >
                  수정
                </button>

                <button
                  class="delete-button"
                  type="button"
                  onclick="deleteSchedule(${item.id})"
                >
                  삭제
                </button>

              </div>

            </article>
          `;
        }).join("");
    }

    scheduleForm.addEventListener(
      "submit",
      async event => {
        event.preventDefault();

        statusBox.textContent =
          editingId
            ? "수정 중..."
            : "등록 중...";

        const scheduleData = {
          date:
            document.querySelector("#date").value,

          time:
            document.querySelector("#time").value || null,

          title:
            document.querySelector("#title").value.trim(),

          type:
            document.querySelector("#type").value,

          description:
            document.querySelector("#description").value.trim()
        };

        let result;

        if (editingId) {
          result =
            await supabaseClient
              .from("stream_schedule")
              .update(scheduleData)
              .eq("id", editingId);
        } else {
          result =
            await supabaseClient
              .from("stream_schedule")
              .insert(scheduleData);
        }

        if (result.error) {
          console.error(result.error);

          statusBox.textContent =
            "저장하지 못했어요.";

          return;
        }

        statusBox.textContent =
          editingId
            ? "일정을 수정했어요! 🩵"
            : "일정을 등록했어요! 🩵";

        resetForm();
        await loadSchedules();
      }
    );

    window.editSchedule =
      function(id) {

        const item =
          schedules.find(
            schedule => schedule.id === id
          );

        if (!item) return;

        editingId = id;

        document.querySelector("#date").value =
          item.date || "";

        document.querySelector("#time").value =
          item.time
            ? String(item.time).slice(0, 5)
            : "";

        document.querySelector("#title").value =
          item.title || "";

        document.querySelector("#type").value =
          item.type || "live";

        document.querySelector("#description").value =
          item.description || "";

        formTitle.textContent =
          "일정 수정";

        saveButton.textContent =
          "수정 저장";

        cancelEdit.classList.remove("hidden");

        window.scrollTo({
          top: 0,
          behavior: "smooth"
        });
      };

    window.deleteSchedule =
      async function(id) {

        const confirmed =
          confirm("이 일정을 삭제할까요?");

        if (!confirmed) return;

        const {
          error
        } =
          await supabaseClient
            .from("stream_schedule")
            .delete()
            .eq("id", id);

        if (error) {
          console.error(error);

          alert(
            "일정을 삭제하지 못했어요."
          );

          return;
        }

        if (editingId === id) {
          resetForm();
        }

        await loadSchedules();
      };

    cancelEdit.addEventListener(
      "click",
      resetForm
    );

    function resetForm() {
      editingId = null;

      scheduleForm.reset();
  document.querySelector("#time").value = "12:00";

      formTitle.textContent =
        "새 일정 추가";

      saveButton.textContent =
        "일정 등록";

      cancelEdit.classList.add("hidden");
    }

    function escapeHTML(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    checkSession();
  </script>

</body>
</html>
