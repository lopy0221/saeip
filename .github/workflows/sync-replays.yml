
name: Sync SOOP Replays

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Sync replays
        run: |
          curl --fail --silent --show-error \
            --retry 2 \
            --max-time 120 \
            -H "Authorization: Bearer ${{ secrets.SOOP_SYNC_TOKEN }}" \
            "https://saeip.vercel.app/api/sync-replays"
